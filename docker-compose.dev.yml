# Local development stack: only the infrastructure the app needs (PostgreSQL) and a mail catcher (Mailpit).
# The app itself runs from Rider / `dotnet run` on the host and connects via
# localhost:5432 using the connection string in appsettings.json.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # keep data
#   docker compose -f docker-compose.dev.yml down -v     # wipe data
#
# Works with Docker or rootless Podman (podman.socket + docker-compose v2).

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: genocrm-dev-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Must match ConnectionStrings:DefaultConnection in GenoCRM/GenoCRM/appsettings.json
      POSTGRES_DB: genocrm
      POSTGRES_USER: genocrm
      POSTGRES_PASSWORD: genocrm123
    volumes:
      - genocrm_dev_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genocrm -d genocrm"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Catches all outgoing mail in development; nothing is delivered.
  # SMTP on localhost:1025 (see Smtp in appsettings.Development.json),
  # web UI at http://localhost:8025
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: genocrm-dev-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      # Accept any credentials over plain SMTP so the app's Username/Password are harmless
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    restart: unless-stopped

volumes:
  genocrm_dev_pgdata:
